<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advent Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Felt-patchwork calendar: doors are stitched squares, each opening to a link card.
   Colors below are defaults; calendar.json "theme" overrides them at load. */
:root {
  --bg: #11261d;
  --surface: #1a3529;
  --text: #f2e9d6;
  --accent: #e0b25a;
  --accent-text: #2a1e08;
  --highlight: #c4404a;
  --info: #a9c9d8;
  --muted: #a7b9ad;
  --tile: #9e2f38;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* fixed icon paints */
  --i-green: #4f9a6b; --i-brown: #c07f45; --i-dkbrown: #7a4a25; --i-dark: #1d1a17;
  --i-orange: #e8873a; --i-skin: #edc2a4; --i-beige: #e6d2b0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 20% 0%, rgba(255,255,255,.05) 0, transparent 55%), radial-gradient(circle at 90% 100%, rgba(120,160,255,.06) 0, transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 28px; }
.home-inner { display: grid; gap: 24px; }

header { display: grid; gap: 10px; }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--info); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 52px); line-height: 1.05; margin: 0; text-wrap: balance; }
.status { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid rgba(255,255,255,.14); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.pill.preview { border-color: var(--accent); color: var(--accent); }
.pill.warn { border-color: var(--highlight); }

.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 460px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }

.door {
  position: relative; aspect-ratio: 1 / 1.08; border: 0; border-radius: 10px; padding: 0; cursor: pointer;
  color: var(--text); font: inherit; background: var(--tile);
  box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
  transition: transform .18s ease, box-shadow .18s ease;
  overflow: hidden;
}
.door::before { content: ""; position: absolute; inset: 6px; border: 2px dashed rgba(255,255,255,.3); border-radius: 6px; pointer-events: none; }
.door .num { position: absolute; left: 12px; top: 8px; font-family: var(--font-display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.door.locked .num { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: clamp(30px, 5vw, 40px); color: rgba(255,255,255,.82); }
.door.locked { cursor: default; filter: saturate(.75); }
.door .lockdate { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.door .art { position: absolute; inset: 22% 16% 18%; display: grid; place-items: center; }
.door .art svg, .door .art img { width: 100%; height: 100%; object-fit: contain; }
.door .art .emoji { font-size: clamp(30px, 6vw, 46px); line-height: 1; }
.door .art .label { font-size: 13px; font-weight: 600; line-height: 1.25; text-align: center; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.door .tag { position: absolute; right: 10px; top: 10px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-text); }
.door .tag.done { background: var(--text); color: var(--bg); }
.door.open:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 8px 18px rgba(0,0,0,.4); }
.door.today { box-shadow: 0 0 0 3px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 45%, transparent); }
.door.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.toast { min-height: 24px; font-size: 14px; color: var(--info); }

.panel { background: var(--surface); border-radius: 14px; padding: 18px 20px; display: grid; gap: 10px; border: 1px solid rgba(255,255,255,.1); }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.panel ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; max-width: 65ch; }
.fine { font-size: 13px; color: var(--muted); max-width: 70ch; margin: 0; }

.detail { display: none; gap: 20px; }
body.show-detail .home { display: none; }
body.show-detail .detail { display: grid; }
.back { justify-self: start; background: none; border: 1px solid rgba(255,255,255,.25); color: var(--text); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.back:hover { border-color: var(--accent); }
.card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
@media (max-width: 720px) { .card { grid-template-columns: 1fr; } }
.photo { position: relative; aspect-ratio: 4 / 3.3; border-radius: 14px; overflow: hidden; display: grid; place-items: center; background: var(--tile); }
.photo::before { content: ""; position: absolute; inset: 10px; border: 2px dashed rgba(255,255,255,.3); border-radius: 9px; pointer-events: none; z-index: 1; }
.photo .art { width: 52%; height: 62%; display: grid; place-items: center; }
.photo .art svg, .photo .art img { width: 100%; height: 100%; object-fit: contain; }
.photo .art .emoji { font-size: 96px; line-height: 1; }
.photo .art .bignum { font-family: var(--font-display); font-size: 110px; color: var(--accent); }
.photo > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo .credit { position: absolute; right: 12px; bottom: 12px; z-index: 2; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff; }
.info { display: grid; gap: 14px; }
.info .day { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--info); font-weight: 600; }
.info h2:focus { outline: none; }
.info h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 4.6vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.info .by { color: var(--muted); margin: -6px 0 0; }
.info p { margin: 0; max-width: 60ch; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 15px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.notes { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 10px; font: inherit; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; border: 0; }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.3); }
.btn.ghost[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn:disabled { opacity: .6; cursor: wait; }
.nav { display: flex; justify-content: space-between; gap: 10px; }
.nav button { background: none; border: 0; color: var(--info); font: inherit; font-size: 14px; cursor: pointer; padding: 6px 0; }
.nav button:disabled { opacity: .35; cursor: default; }

.error { background: var(--surface); border: 1px solid var(--highlight); border-radius: 14px; padding: 20px; }
.error h1 { font-size: 28px; margin-bottom: 10px; }
.error code { background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 4px; }

/* Icon paint */
.f-w { fill: var(--text); } .f-r { fill: var(--highlight); } .f-g { fill: var(--i-green); } .f-b { fill: var(--accent); }
.f-n { fill: var(--i-brown); } .f-d { fill: var(--i-dark); } .f-f { fill: var(--info); } .f-o { fill: var(--i-orange); } .f-pk { fill: var(--i-skin); } .f-be { fill: var(--i-beige); }
.l { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.s-w { stroke: var(--text); } .s-r { stroke: var(--highlight); } .s-g { stroke: var(--i-green); } .s-b { stroke: var(--accent); }
.s-n { stroke: var(--i-brown); } .s-nd { stroke: var(--i-dkbrown); } .s-f { stroke: var(--info); } .s-d { stroke: var(--i-dark); }

@media (prefers-reduced-motion: reduce) {
  .door, .door.open:hover { transition: none; transform: none; }
  .door.shake { animation: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <section class="home" aria-labelledby="title">
    <div class="home-inner">
      <header>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title">Loading…</h1>
        <div class="status" id="status"></div>
      </header>
      <div class="grid" id="grid" role="list"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <section class="panel" id="panel" aria-labelledby="panel-h" hidden>
        <h2 id="panel-h"></h2>
        <ul id="panel-list"></ul>
      </section>
      <p class="fine" id="footer" hidden></p>
    </div>
  </section>
  <section class="detail" id="detail" aria-live="polite"></section>
</div>

<script>
(function () {
  "use strict";

  // ---------- Helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isHttp(u) { return typeof u === "string" && /^https?:\/\//i.test(u); }
  function $(id) { return document.getElementById(id); }

  // ---------- Built-in icons (64x64, simple shapes) ----------
  function snowArms(cls, sw, scale) {
    var s = "";
    for (var a = 0; a < 360; a += 60) {
      s += '<path transform="rotate(' + a + ' 32 32)" d="M32 32V' + (32 - 22 * scale) + ' M32 ' + (32 - 14 * scale) + 'l-' + 6 * scale + ' -' + 6 * scale + ' M32 ' + (32 - 14 * scale) + 'l' + 6 * scale + ' -' + 6 * scale + ' M32 ' + (32 - 7 * scale) + 'l-' + 5 * scale + ' -' + 4 * scale + ' M32 ' + (32 - 7 * scale) + 'l' + 5 * scale + ' -' + 4 * scale + '"/>';
    }
    return '<g class="l ' + cls + '" stroke-width="' + sw + '">' + s + '</g>';
  }
  function wedge(r, a1, a2, cls) {
    var x1 = 32 + r * Math.cos(a1), y1 = 32 + r * Math.sin(a1), x2 = 32 + r * Math.cos(a2), y2 = 32 + r * Math.sin(a2);
    return '<path class="' + cls + '" d="M32 32L' + x1.toFixed(2) + ' ' + y1.toFixed(2) + 'A' + r + ' ' + r + ' 0 0 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) + 'z"/>';
  }
  function starPts(cx, cy, R, r) {
    var p = [];
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R;
      p.push((cx + rad * Math.cos(ang)).toFixed(2) + "," + (cy + rad * Math.sin(ang)).toFixed(2));
    }
    return p.join(" ");
  }
  var ICONS = {
    "gift-card": function () { return '<rect x="19" y="10" width="26" height="16" rx="2" class="f-f"/><rect x="12" y="20" width="40" height="32" rx="4" class="f-r"/><rect x="12" y="32" width="40" height="8" class="f-d"/><rect x="27" y="30" width="10" height="12" rx="1.5" class="l s-b" stroke-width="2.5"/>'; },
    "bauble": function () { return '<circle cx="32" cy="8" r="3" class="l s-b" stroke-width="2"/><rect x="27" y="10" width="10" height="7" rx="2" class="f-b"/><circle cx="32" cy="36" r="20" class="f-r"/><path class="l s-w" stroke-width="4" d="M13 31h38M14 41h36"/>'; },
    "mitten": function () { return '<ellipse cx="18" cy="34" rx="6" ry="9" transform="rotate(-25 18 34)" class="f-r"/><path class="f-r" d="M20 50V26a12 12 0 0 1 24 0v24z"/><rect x="17" y="46" width="30" height="10" rx="3" class="f-w"/>'; },
    "peppermint": function () {
      var s = '<path class="f-f" d="M17 32 5 23v18z"/><path class="f-f" d="M47 32 59 23v18z"/><circle cx="32" cy="32" r="16" class="f-w"/>';
      for (var k = 0; k < 6; k++) { s += wedge(16, k * Math.PI / 3, k * Math.PI / 3 + Math.PI / 6, "f-r"); }
      return s;
    },
    "mug": function () { return '<path class="l s-f" stroke-width="3" d="M24 12q-3-4 0-8M33 12q-3-4 0-8"/><path class="l s-w" stroke-width="5" d="M44 26h4a6 6 0 0 1 0 12h-4"/><rect x="14" y="18" width="30" height="34" rx="4" class="f-w"/><rect x="12" y="28" width="34" height="14" rx="3" class="f-r"/><path class="l s-b" stroke-width="2" stroke-dasharray="2 4" d="M15 35h28"/>'; },
    "ear-warmer": function () { return '<ellipse cx="32" cy="32" rx="22" ry="13" class="l s-r" stroke-width="9"/><path class="l s-w" stroke-width="2" stroke-dasharray="1 4" d="M14 30q18 -14 36 0"/><rect x="25" y="38" width="14" height="13" rx="4" class="f-b"/>'; },
    "santa-hat": function () { return '<path class="f-r" d="M14 46C18 24 30 12 46 14c-6 6-4 20 4 32z"/><rect x="10" y="44" width="44" height="10" rx="5" class="f-w"/><circle cx="47" cy="14" r="5" class="f-w"/>'; },
    "tree": function () { return '<rect x="29" y="47" width="6" height="8" class="f-n"/><path class="f-g" d="M32 10 46 30H39L51 48H13L25 30H18z"/><circle cx="32" cy="10" r="3.5" class="f-b"/><circle cx="27" cy="27" r="2" class="f-r"/><circle cx="37" cy="38" r="2" class="f-r"/><circle cx="24" cy="42" r="2" class="f-b"/>'; },
    "beanie": function () { return '<circle cx="32" cy="23" r="6" class="f-w"/><path class="f-g" d="M14 44a18 18 0 0 1 36 0z"/><path class="l s-w" stroke-width="3" d="M17 37h30"/><rect x="12" y="42" width="40" height="10" rx="3" class="f-w"/>'; },
    "stocking": function () { return '<path class="f-r" d="M24 12h18v26c0 8-4 13-12 15l-8 2a7 7 0 0 1-4-13l6-4z"/><rect x="22" y="8" width="22" height="10" rx="3" class="f-w"/>'; },
    "gingerbread": function () { return '<path class="l s-n" stroke-width="10" d="M32 26v17M21 32h22M27 44l-5 9M37 44l5 9"/><circle cx="32" cy="18" r="8.5" class="f-n"/><circle cx="29" cy="17" r="1.6" class="f-w"/><circle cx="35" cy="17" r="1.6" class="f-w"/><circle cx="32" cy="31" r="2" class="f-r"/><circle cx="32" cy="38" r="2" class="f-r"/><path class="l s-w" stroke-width="1.8" d="M15 30l2 2 2-2 2 2M43 30l2 2 2-2 2 2"/>'; },
    "gingerbread-house": function () { return '<path class="f-n" d="M14 30 32 14 50 30V52H14z"/><path class="l s-w" stroke-width="4" d="M11 31 32 12 53 31"/><rect x="18" y="34" width="7" height="7" rx="1" class="f-b"/><rect x="39" y="34" width="7" height="7" rx="1" class="f-b"/><path class="f-r" d="M27 52V43a5 5 0 0 1 10 0v9z"/>'; },
    "snowman": function () { return '<circle cx="32" cy="43" r="13" class="f-w"/><circle cx="32" cy="25" r="9" class="f-w"/><rect x="25" y="8" width="14" height="9" rx="2" class="f-d"/><rect x="21" y="15" width="22" height="3" rx="1.5" class="f-d"/><rect x="22" y="32" width="20" height="4" rx="2" class="f-r"/><path class="f-o" d="M32 25l8 2-8 1.5z"/><circle cx="29" cy="23" r="1.3" class="f-d"/><circle cx="35" cy="23" r="1.3" class="f-d"/>'; },
    "coaster": function () { return '<circle cx="32" cy="32" r="23" class="f-f"/><circle cx="32" cy="32" r="23" class="l s-w" stroke-width="2" stroke-dasharray="2 4"/>' + snowArms("s-w", 2.6, 0.7); },
    "poinsettia": function () {
      var s = "";
      for (var i = 0; i < 5; i++) { s += '<ellipse cx="32" cy="13" rx="5" ry="12" class="f-g" transform="rotate(' + (36 + i * 72) + ' 32 32)"/>'; }
      for (var j = 0; j < 5; j++) { s += '<ellipse cx="32" cy="15" rx="6" ry="13" class="f-r" transform="rotate(' + (j * 72) + ' 32 32)"/>'; }
      return s + '<circle cx="30" cy="30" r="2.2" class="f-b"/><circle cx="34" cy="30" r="2.2" class="f-b"/><circle cx="32" cy="34" r="2.2" class="f-b"/>';
    },
    "sweater": function () { return '<path class="f-g" d="M22 12h20l12 8-5 10-5-3v25H20V27l-5 3-5-10z"/><path class="l s-r" stroke-width="3" d="M26 12q6 6 12 0"/><path class="l s-w" stroke-width="2.5" d="M22 36l5 4 5-4 5 4 5-4"/><circle cx="32" cy="46" r="2" class="f-b"/>'; },
    "bulb": function () { return '<path class="f-b" d="M27 17h10l-2-7h-6z"/><circle cx="32" cy="37" r="20" class="f-g"/><path class="l s-w" stroke-width="3" d="M13 33l6 4 6-4 7 4 6-4 6 4 6-4"/><path class="l s-r" stroke-width="3" d="M14 43h36"/>'; },
    "snowflake": function () { return snowArms("s-w", 3.5, 1); },
    "cone-tree": function () { return '<path class="f-g" d="M32 8 50 54H14z"/><path class="l s-w" stroke-width="3" d="M20.5 40q3 3 6 0t6 0 6 0 6 0M26 25q2 2 4 0t4 0 4 0"/><circle cx="32" cy="8" r="3.5" class="f-b"/>'; },
    "santa": function () { return '<circle cx="32" cy="35" r="12" class="f-pk"/><path class="f-w" d="M19 35c0 13 7 19 13 19s13-6 13-19c-4 5-22 5-26 0z"/><path class="f-r" d="M18 29c2-12 12-18 26-14-4 4-2 10 2 14z"/><rect x="16" y="25" width="32" height="7" rx="3.5" class="f-w"/><circle cx="46" cy="15" r="4" class="f-w"/><circle cx="28" cy="36" r="1.4" class="f-d"/><circle cx="36" cy="36" r="1.4" class="f-d"/><circle cx="32" cy="40" r="2" class="f-r"/>'; },
    "wreath": function () { return '<circle cx="32" cy="30" r="17" class="l s-g" stroke-width="10"/><circle cx="20" cy="22" r="2.2" class="f-r"/><circle cx="44" cy="24" r="2.2" class="f-r"/><circle cx="16" cy="34" r="2.2" class="f-r"/><circle cx="47" cy="36" r="2.2" class="f-r"/><path class="f-r" d="M32 47l-10-6v12zM32 47l10-6v12z"/><circle cx="32" cy="47" r="3" class="f-r"/>'; },
    "reindeer": function () { return '<path class="l s-nd" stroke-width="3.5" d="M23 22 16 8M18.5 15l-7-3M41 22l7-14M45.5 15l7-3"/><ellipse cx="17" cy="29" rx="6" ry="3.5" transform="rotate(-25 17 29)" class="f-n"/><ellipse cx="47" cy="29" rx="6" ry="3.5" transform="rotate(25 47 29)" class="f-n"/><circle cx="32" cy="35" r="15" class="f-n"/><ellipse cx="32" cy="43" rx="10" ry="7" class="f-be"/><circle cx="32" cy="39" r="3.5" class="f-r"/><circle cx="26" cy="32" r="1.6" class="f-d"/><circle cx="38" cy="32" r="1.6" class="f-d"/>'; },
    "candy-cane": function () { return '<path class="l s-w" stroke-width="9" d="M38 56V22a8 8 0 0 0-16 0"/><path class="l s-r" stroke-width="9" stroke-linecap="butt" stroke-dasharray="5 5" d="M38 56V22a8 8 0 0 0-16 0"/><path class="f-g" d="M38 40l-8-4v8zM38 40l8-4v8z"/>'; },
    "star": function () { return '<polygon class="f-b" points="' + starPts(32, 33, 24, 10) + '"/><path class="l s-w" stroke-width="2" d="M52 10v6M49 13h6M12 50v4M10 52h4"/>'; }
  };

  // Returns inner HTML for an icon slot, or "" if the entry has no icon.
  function iconHtml(icon) {
    if (!icon) return "";
    if (ICONS[icon]) return '<svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">' + ICONS[icon]() + '</svg>';
    if (isHttp(icon)) return '<img src="' + esc(icon) + '" alt="" referrerpolicy="no-referrer">';
    if (String(icon).length <= 8) return '<span class="emoji" aria-hidden="true">' + esc(icon) + '</span>';
    return "";
  }

  // ---------- Config ----------
  var DEFAULT_LABELS = {
    day: "Day", doors: "doors open", doneCount: "done", untilFirst: "until the first door",
    dayOne: "day", dayMany: "days", newTag: "New", doneTag: "Done", markDone: "Mark as done",
    done: "Done ✓", openLink: "Open the link", byPrefix: "By", back: "Back to the calendar",
    opensOn: "opens on", preview: "Preview: all doors unlocked", syncOff: "Progress sync unavailable; saving in this browser"
  };
  var cfg, L, N, START, ORDER, LOCALE;

  function showError(errs) {
    $("app").innerHTML = '<div class="error"><h1>This calendar has a problem</h1><p>Fix these in the calendar JSON file, then reload:</p><ul>' +
      errs.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul></div>";
    document.title = "Calendar error";
  }

  function seededShuffle(n, seedStr) {
    var h = 2166136261;
    for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    function rnd() { h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    var a = []; for (var k = 1; k <= n; k++) a.push(k);
    for (var j = n - 1; j > 0; j--) { var r = Math.floor(rnd() * (j + 1)); var tmp = a[j]; a[j] = a[r]; a[r] = tmp; }
    return a;
  }

  function buildOrder() {
    var o = cfg.order;
    if (Array.isArray(o)) {
      var seen = {};
      var ok = o.length === N && o.every(function (x) { var good = Number.isInteger(x) && x >= 1 && x <= N && !seen[x]; seen[x] = 1; return good; });
      if (ok) return o.slice();
      console.warn('"order" must list each day 1..' + N + ' exactly once; using sequential order');
    } else if (o === "shuffled") {
      return seededShuffle(N, String(cfg.id || cfg.title));
    }
    var a = []; for (var k = 1; k <= N; k++) a.push(k); return a;
  }

  function applyTheme(t) {
    if (!t || typeof t !== "object") return;
    var map = { bg: "--bg", surface: "--surface", text: "--text", accent: "--accent", accentText: "--accent-text", highlight: "--highlight", info: "--info", muted: "--muted" };
    Object.keys(map).forEach(function (k) {
      if (typeof t[k] === "string" && CSS.supports("color", t[k])) document.documentElement.style.setProperty(map[k], t[k]);
    });
  }
  function tileColor(pos) {
    var tiles = (cfg.theme && Array.isArray(cfg.theme.tiles)) ? cfg.theme.tiles.filter(function (c) { return typeof c === "string" && CSS.supports("color", c); }) : [];
    if (!tiles.length) tiles = ["#9e2f38", "#2d5a42", "#253a52"];
    return tiles[pos % tiles.length];
  }

  // ---------- Dates ----------
  function openDate(n) { return new Date(START.getFullYear(), START.getMonth(), START.getDate() + n - 1); }
  function startOfToday() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function isOpen(n) { return preview || new Date() >= openDate(n); }
  function fmt(d) { return new Intl.DateTimeFormat(LOCALE, { weekday: "short", month: "short", day: "numeric" }).format(d); }
  function autoSubtitle() {
    var a = openDate(1), b = openDate(N);
    var month = new Intl.DateTimeFormat(LOCALE, { month: "long" });
    if (N === 1) return month.format(a) + " " + a.getDate();
    if (a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()) return month.format(a) + " " + a.getDate() + " to " + b.getDate();
    return month.format(a) + " " + a.getDate() + " to " + month.format(b) + " " + b.getDate();
  }

  // ---------- Storage + progress ----------
  function load(key) { try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { return {}; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  var preview = false, visited = {}, finished = {}, mode = "browser", syncFailed = false, KEY;

  function syncFail() { syncFailed = true; mode = "browser"; finished = load(KEY + "-finished"); }

  function initProgress() {
    visited = load(KEY + "-visited");
    if (cfg.progress !== "server") { finished = load(KEY + "-finished"); return Promise.resolve(); }
    mode = "server";
    return fetch("api/progress", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }).then(function (j) {
      finished = {}; (j.finished || []).forEach(function (n) { finished[n] = 1; });
    }).catch(syncFail);
  }

  function setDone(n, done) {
    if (mode !== "server") {
      if (done) finished[n] = 1; else delete finished[n];
      save(KEY + "-finished", finished);
      return Promise.resolve();
    }
    return fetch("api/progress", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ day: n, done: done }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { finished = {}; (j.finished || []).forEach(function (d) { finished[d] = 1; }); });
  }

  // ---------- Home ----------
  var grid, toast, statusEl, detail;

  function renderStatus() {
    var today = startOfToday(), d1 = openDate(1);
    var opened = 0, made = 0;
    for (var n = 1; n <= N; n++) { if (isOpen(n)) opened++; if (finished[n]) made++; }
    var html = "";
    if (!preview && today < d1) {
      var days = Math.round((d1 - today) / 86400000);
      html += '<span class="pill"><span class="dot"></span>' + days + " " + esc(days === 1 ? L.dayOne : L.dayMany) + " " + esc(L.untilFirst) + "</span>";
    } else {
      html += '<span class="pill"><span class="dot"></span>' + opened + " of " + N + " " + esc(L.doors) + "</span>";
    }
    html += '<span class="pill">' + made + " of " + N + " " + esc(L.doneCount) + "</span>";
    if (preview) html += '<span class="pill preview">' + esc(L.preview) + "</span>";
    if (syncFailed) html += '<span class="pill warn">' + esc(L.syncOff) + "</span>";
    statusEl.innerHTML = html;
  }

  function renderGrid() {
    renderStatus();
    var todayT = startOfToday().getTime();
    grid.innerHTML = "";
    ORDER.forEach(function (n, pos) {
      var d = cfg.entries[n - 1];
      var open = isOpen(n);
      var b = document.createElement("button");
      b.type = "button";
      b.id = "door-" + n;
      b.setAttribute("role", "listitem");
      b.style.setProperty("--tile", tileColor(pos));
      b.className = "door" + (open ? " open" : " locked") + (openDate(n).getTime() === todayT ? " today" : "");
      if (open) {
        b.setAttribute("aria-label", L.day + " " + n + ": " + d.title + (finished[n] ? ", " + L.doneTag : ""));
        var art = iconHtml(d.icon) || '<span class="label">' + esc(d.title) + "</span>";
        b.innerHTML = '<span class="num">' + n + '</span><span class="art">' + art + "</span>" +
          (finished[n] ? '<span class="tag done">' + esc(L.doneTag) + "</span>" : (!visited[n] ? '<span class="tag">' + esc(L.newTag) + "</span>" : ""));
        b.addEventListener("click", function () { location.hash = "day-" + n; });
      } else {
        var od = openDate(n);
        b.setAttribute("aria-label", L.day + " " + n + ", " + L.opensOn + " " + fmt(od));
        b.innerHTML = '<span class="num">' + n + '</span><span class="lockdate">' + esc(fmt(od)) + "</span>";
        b.addEventListener("click", function () {
          toast.textContent = L.day + " " + n + " " + L.opensOn + " " + fmt(od) + ".";
          b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        });
      }
      grid.appendChild(b);
    });
  }

  // ---------- Detail ----------
  function renderDetail(n) {
    var d = cfg.entries[n - 1];
    if (!d || !isOpen(n)) { location.hash = ""; return; }
    visited[n] = 1; save(KEY + "-visited", visited);
    var od = openDate(n);
    var notes = Array.isArray(d.notes) && d.notes.length ? '<ul class="notes">' + d.notes.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" : "";
    var facts = d.facts && typeof d.facts === "object" ? Object.keys(d.facts).filter(function (k) { return d.facts[k] != null && d.facts[k] !== ""; }) : [];
    var factsHtml = facts.length ? '<dl class="facts">' + facts.map(function (k) { return "<dt>" + esc(k) + "</dt><dd>" + esc(d.facts[k]) + "</dd>"; }).join("") + "</dl>" : "";
    var art = iconHtml(d.icon) || '<span class="bignum">' + n + "</span>";
    detail.innerHTML =
      '<button type="button" class="back" id="back">' + esc(L.back) + "</button>" +
      '<div class="card">' +
        '<div class="photo" id="photo" style="--tile:' + esc(tileColor(ORDER.indexOf(n))) + '"><div class="art">' + art + "</div></div>" +
        '<div class="info">' +
          '<div class="day">' + esc(L.day) + " " + n + " · " + esc(fmt(od)) + "</div>" +
          '<h2 id="detail-title" tabindex="-1">' + esc(d.title) + "</h2>" +
          (d.by ? '<p class="by">' + esc(L.byPrefix) + " " + esc(d.by) + "</p>" : "") +
          (d.blurb ? "<p>" + esc(d.blurb) + "</p>" : "") +
          factsHtml + notes +
          '<div class="actions">' +
            '<a class="btn primary" href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer">' + esc(d.linkText || L.openLink) + "</a>" +
            '<button type="button" class="btn ghost" id="made" aria-pressed="' + (finished[n] ? "true" : "false") + '">' + esc(finished[n] ? L.done : L.markDone) + "</button>" +
          "</div>" +
          '<div class="nav">' +
            '<button type="button" id="prev"' + (n === 1 ? " disabled" : "") + ">← " + esc(L.day) + " " + Math.max(n - 1, 1) + "</button>" +
            '<button type="button" id="next"' + (n === N || !isOpen(n + 1) ? " disabled" : "") + ">" + esc(L.day) + " " + Math.min(n + 1, N) + " →</button>" +
          "</div>" +
        "</div>" +
      "</div>";

    $("back").addEventListener("click", function () { location.hash = ""; });
    $("prev").addEventListener("click", function () { if (n > 1) location.hash = "day-" + (n - 1); });
    $("next").addEventListener("click", function () { if (n < N) location.hash = "day-" + (n + 1); });
    var madeBtn = $("made");
    madeBtn.addEventListener("click", function () {
      var want = !finished[n];
      madeBtn.disabled = true;
      setDone(n, want).catch(function () {
        syncFail();
        if (want) finished[n] = 1; else delete finished[n];
        save(KEY + "-finished", finished);
      }).then(function () {
        madeBtn.disabled = false;
        madeBtn.setAttribute("aria-pressed", finished[n] ? "true" : "false");
        madeBtn.textContent = finished[n] ? L.done : L.markDone;
      });
    });

    // Optional photo: replaces the icon once it loads; the icon stays if it can't.
    if (isHttp(d.img)) {
      var im = new Image();
      im.alt = d.title + (d.by ? ", photo by " + d.by : "");
      im.referrerPolicy = "no-referrer";
      im.onload = function () {
        var box = $("photo");
        if (!box || detail.getAttribute("data-day") !== String(n)) return;
        box.innerHTML = "";
        box.appendChild(im);
        if (d.by) {
          var c = document.createElement("span");
          c.className = "credit"; c.textContent = "Photo: " + d.by;
          box.appendChild(c);
        }
      };
      im.src = d.img;
    }
    detail.setAttribute("data-day", String(n));
    document.body.classList.add("show-detail");
    window.scrollTo(0, 0);
    var t = $("detail-title"); if (t) t.focus({ preventScroll: true });
  }

  // ---------- Routing ----------
  function route() {
    var h = location.hash.replace("#", "");
    if (h === "preview" && cfg.allowPreview !== false) {
      preview = !preview;
      try { sessionStorage.setItem(KEY + "-preview", preview ? "1" : "0"); } catch (e) {}
      location.hash = "";
      return;
    }
    var m = /^day-(\d{1,3})$/.exec(h);
    if (m) { renderDetail(parseInt(m[1], 10)); return; }
    document.body.classList.remove("show-detail");
    detail.removeAttribute("data-day");
    toast.textContent = "";
    renderGrid();
  }

  // ---------- Boot ----------
  function start(c) {
    if (c.errors) { showError(c.errors); return; }
    cfg = c;
    N = cfg.days;
    var p = String(cfg.startDate).split("-").map(Number);
    START = new Date(p[0], p[1] - 1, p[2]);
    LOCALE = cfg.locale || undefined;
    L = Object.assign({}, DEFAULT_LABELS, cfg.labels || {});
    KEY = "adv-" + (cfg.id || "calendar");
    ORDER = buildOrder();
    applyTheme(cfg.theme);
    if (cfg.allowPreview !== false) { try { preview = sessionStorage.getItem(KEY + "-preview") === "1"; } catch (e) {} }

    document.title = cfg.title;
    $("title").textContent = cfg.title;
    $("eyebrow").textContent = cfg.subtitle || autoSubtitle();
    if (cfg.panel && cfg.panel.heading) {
      $("panel-h").textContent = cfg.panel.heading;
      $("panel-list").innerHTML = (cfg.panel.items || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("");
      $("panel").hidden = false;
    }
    if (cfg.footer) { $("footer").textContent = cfg.footer; $("footer").hidden = false; }

    grid = $("grid"); toast = $("toast"); statusEl = $("status"); detail = $("detail");
    initProgress().then(function () {
      window.addEventListener("hashchange", route);
      route();
    });
  }

  fetch("calendar.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(start)
    .catch(function (e) { showError(["Couldn't load calendar.json (" + e.message + ")"]); });
})();
</script>
</body>
</html>
